; TODO
[/settings/default]

; Undocumented key
password = REDACTEDCRED

; Undocumented key
allowed hosts = 127.0.0.1,::1,REDACTEDIP

; CACHE ALLOWED HOSTS - If host names (DNS entries) should be cached, improves speed and security somewhat but won't allow you to have dynamic IPs for your Nagios server.
cache allowed hosts = 1

; TIMEOUT - Timeout when reading packets on incoming sockets. If the data has not arrived within this time we will bail out.
timeout = 30


; TODO
[/modules]

; Undocumented key
CheckExternalScripts = 1

; Undocumented key
;CheckHelpers = 1

; Undocumented key
CheckEventLog = 1

; Undocumented key
CheckNSCP = 1

; Undocumented key
CheckDisk = 1

; Undocumented key
CheckSystem = 1

; ping checks
CheckNet = 1

; Undocumented key
NSClientServer = 1

; NRPEServer - A server that listens for incoming NRPE connection and processes incoming requests.
NRPEServer = enabled


; A set of options to configure the real time checks
[/settings/system/windows/real-time]


; Configure which services has to be in which state
[/settings/system/windows/service mapping]


; TODO
[/settings/system/windows/counters/default]


; TODO
[/settings/system/windows/counters]


; TODO
[/settings/log/file]


; TODO
[/settings/log]

; LOG LEVEL - Log level to use. Available levels are error,warning,info,debug,trace
level = info

; DATEMASK - The size of the buffer to use when getting messages this affects the speed and maximum size of messages you can recieve.
date format = %Y-%m-%d %H:%M:%S

; FILENAME - The file to write log data to. Set this to none to disable log to file.
file name = ${exe-path}/nsclient.log


; TODO
[/settings/system/windows]

; DEFAULT LENGTH - Used to define the default interval for range buffer checks (ie. CPU).
default buffer length = 1h

; TODO
[/settings/eventlog/real-time/filters/default]

; EMPTY MESSAGE - The message to display if nothing matches the filter (generally considered the ok state).
empty message = eventlog found no records

; MAGIMUM AGE - How long before reporting "ok". If this is set to "false" no periodic ok messages will be reported only errors.
maximum age = 5m


; A set of filters to use in real-time mode
[/settings/eventlog/real-time/filters]


; TODO
[/settings/eventlog/real-time]

; STARTUP AGE - The initial age to scan when starting NSClient++
startup age = 30m

; REAL TIME CHECKING - Spawns a background thread which detects issues and reports them back instantly.
enabled = 0

; LOGS TO CHECK - Comma separated list of logs to check
log = application,system

; DEBUG - Log missed records (useful to detect issues with filters) not useful in production as it is a bit of a resource hog.
debug = 0

; TODO
[/settings/shared session]


; TODO
[/settings/crash]

; RESTART SERVICE NAME - The url to submit crash reports to
restart target = NSCP

; CRASH ARCHIVE LOCATION - The folder to archive crash dumps in
archive folder = ${crash-folder}

; RESTART - Submit crash reports to nsclient.org (or your configured submission server)
restart = true

; SUBMISSION URL - The url to submit crash reports to
submit url = https://crash.nsclient.org/post

; ARCHIVE CRASHREPORTS - Archive crash reports in the archive folder
archive = true


; A set of filters to use in real-time mode
[/settings/system/windows/real-time/checks]


; TODO
[/settings/NSClient/server]

; ENABLE SSL ENCRYPTION - This option controls if SSL should be enabled.
use ssl = 0

; PORT NUMBER - Port to use for check_nt.
port = 12489

; PERFORMANCE DATA - Send performance data back to Nagios (set this to 0 to remove all performance data).
performance data = 1



; TODO
[/paths]

; Path for shared-path - 
shared-path = c:\Program Files\NSClient++

; Path for module-path - 
module-path = ${shared-path}/modules

; Path for crash-folder - 
crash-folder = ${shared-path}/crash-dumps

; Path for exe-path - 
exe-path = c:\Program Files\NSClient++

; Path for certificate-path - 
certificate-path = ${shared-path}/security

; Path for base-path - 
base-path = c:\Program Files\NSClient++


; Files to be included in the configuration
[/includes]


; TODO
[/settings/eventlog]

; DEBUG - Log more information when filtering (useful to detect issues with filters) not useful in production as it is a bit of a resource hog.
debug = 0

; LOOKUP NAMES - Lookup the names of eventlog files
lookup names = 1

; BUFFER_SIZE - The size of the buffer to use when getting messages this affects the speed and maximum size of messages you can recieve.
buffer size = 131072

[/settings/NRPE/server]
insecure = true 
allow arguments = false
allow nasty characters = false

; TODO
[/settings/external scripts]

; COMMAND TIMEOUT - The maximum time in seconds that a command can execute. (if more then this execution will be aborted). NOTICE this only affects external commands not internal ones.
timeout = 60

; COMMAND ALLOW NASTY META CHARS - This option determines whether or not the we will allow clients to specify nasty (as in |`&><'"\[]{}) characters in arguments.
allow nasty characters = 0

; COMMAND ARGUMENT PROCESSING - This option determines whether or not the we will allow clients to specify arguments to commands that are executed.
allow arguments = 0



[/settings/external scripts/alias]
; processor utilization
alias_cpu = check_cpu filter=none warn=load>95 crit=load>99 time=5m time=20m
; RAM and pagefile % free availability
alias_memory = check_memory warn=free<1% crit=free<0%
;alias_pagefile = check_pagefile warn=free<10% crit=free<2%
; network interface utilization
;alias_network = check_network "warn=total > 10000000" "warn=crit >11250000"
; Drive space availability
alias_drives = check_drivesize drive=all-drives "filter=type in ('fixed') and readable = 1 and mounted = 1" warn=free<15% crit=free<7% exclude="System Reserved"
; generate list of automatic services, check all are started except for the filtered
alias_services = check_service service=* warn=state='stopped' crit=none filter=start_type='auto' exclude=sppsvc exclude=RemoteRegistry exclude=clr_optimization_v4.0.30319_64 exclude=clr_optimization_v4.0.30319_32 exclude=clr_optimization_v2.0.50727_64 exclude=clr_optimization_v2.0.50727_32 exclude=TBS exclude=ShellHWDetection exclude=TrustedInstaller

; custom checks, only used by certain servers
; AOI01
custom_service_autodeletion = check_service service=AutoDeletion warn=none crit=state='stopped'
custom_service_LSRAD = check_service service=LSR_AutoDeletion warn=none crit=state='stopped'
custom_service_LSR = check_service service=LSR_Totalize warn=none crit=state='stopped'
custom_service_omronM = check_service service=MonitoringWindows warn=none crit=state='stopped'
custom_service_RVS = check_service service=RVSServices warn=none crit=state='stopped'
custom_service_omronSQL = check_service service=MSSQLSERVER warn=none crit=state='stopped'
; BCK02
; Veeam on REDACTEDNAME causes some "weird" drives to pop up. For that server, we only monitor for C:
custom_c_drive = check_drivesize drive=C: warn=free<10% crit=free<4% exclude="System Reserved"
; REDACTEDNAME
custom_service_wdpscanners = check_service service=WDPScanners warn=none crit=state='stopped'
; REDACTEDNAME
custom_event_crash = check_eventlog scan-range=-1200s filter=provider='eventlog' warn=written>-1200s crit=none
; REDACTEDNAME
custom_event_volsnap = check_eventlog scan-range=-1200s filter=provider='volsnap' warn=written>-1200s crit=none
; REDACTEDNAME
custom_service_vbexpeditor = check_service service=VBExpeditor warn=none crit=state='stopped'
custom_process_fsguiapp = check_process process=fsguiapp.exe warn=none crit=state!='started'
custom_process_vbserver =  check_process process=VBServer.exe warn=none crit=state!='started'
; ME501
custom_process_plccommunicator = check_process process=PLCCommunicator.exe warn=none crit=state!='started'
custom_ping_wdpplc = check_ping host=REDACTEDIP "warn=time>60 or loss>1%" crit=loss>2%


; TODO
[/settings/external scripts/alias/default]

; TODO
[/settings/external scripts/scripts/default]

; IGNORE PERF DATA - Do not parse performance data from the output
ignore perfdata = 0

; A list of scripts available to run from the CheckExternalScripts module. Syntax is: <command>=<script> <arguments>
[/settings/external scripts/scripts]
; event handlers, these attempt to rectify a problem before reporting by email
; restart PLCCommunicator
handler_restart_plccommunicator = c:\Windows\system32\schtasks.exe /run /tn "Restart PLCCommunicator"
; restart visibar 
handler_restart_visibar = c:\Windows\system32\schtasks.exe /run /tn "Visibar Server Start"
; restart FS Import process 
handler_restart_fsimport = c:\Windows\system32\schtasks.exe /run /tn "FS Import Restart"
; restart Tomcat 
handler_restart_tomcat = c:\Windows\system32\schtasks.exe /run /tn "Restart Tomcat"

; A list of wrapped scripts (ie. scruts using a template mechanism). The template used will be defined by the extension of the script.
[/settings/external scripts/wrapped scripts]
; Check if the user REDACTEDNAME is logged in
custom_safourthshift_ps1 = Monitor-SAFourthShift.ps1
; Check if visibar imports are failing
custom_visibarimport_ps1 = Monitor-VisibarImport.ps1
; Check if Tomcat is OK. Thread count over 80 might mean that Tomcat has crashed
custom_tomcat_ps1 = Monitor-Tomcat.ps1
; Check SQL databases and jobs
custom_sql_ps1 = Monitor-SQL.ps1

; TODO
[/settings/external scripts/wrappings]

; BATCH FILE WRAPPING - 
bat = scripts\\%SCRIPT% %ARGS%

; VISUAL BASIC WRAPPING - 
vbs = cscript.exe //T:30 //NoLogo scripts\\lib\\wrapper.vbs %SCRIPT% %ARGS%

; POWERSHELL WRAPPING - 
ps1 = cmd /c echo If (-Not (Test-Path "scripts\%SCRIPT%") ) { Write-Host "UNKNOWN: Script `"%SCRIPT%`" not found."; exit(3) }; scripts\%SCRIPT% $ARGS$; exit($lastexitcode) | powershell.exe -noprofile -ExecutionPolicy Bypass -command -
